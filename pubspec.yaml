name: mymusixworld
description: "Personal cloud music streaming - stream your own music from Google Drive"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^17.3.0

  # Google auth & drive
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.2

  # Local database
  sqflite: ^2.4.1

  # Secure storage
  flutter_secure_storage: ^10.3.1

  # Audio player
  just_audio: ^0.10.6
  audio_service: ^0.18.17

  # Cache & downloads
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5

  # UI
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.3
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  permission_handler: ^12.0.3
  connectivity_plus: ^7.2.0
  url_launcher: ^6.3.1
  share_plus: ^13.2.0
  collection: ^1.18.0

  # Http
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.2

flutter:
  uses-material-design: true
